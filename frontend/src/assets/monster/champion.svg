<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="成熟期のモンスター（角と翼を持つ大型の獣）">
  <title>成熟期 / CHAMPION</title>
  <defs>
    <linearGradient id="champBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b388ff" />
      <stop offset="100%" stop-color="#6a3fc0" />
    </linearGradient>
    <linearGradient id="champWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8c4ff" />
      <stop offset="100%" stop-color="#8e5be0" />
    </linearGradient>
  </defs>
  <!-- wings (larger, more complex than rookie) -->
  <path d="M70 120 q-56 -14 -58 -58 q22 10 34 6 q-10 20 6 26 q-6 14 18 16 z" fill="url(#champWing)" stroke="#5a2fae" stroke-width="2.5" />
  <path d="M170 120 q56 -14 58 -58 q-22 10 -34 6 q10 20 -6 26 q6 14 -18 16 z" fill="url(#champWing)" stroke="#5a2fae" stroke-width="2.5" />
  <!-- legs with claws -->
  <rect x="84" y="186" width="22" height="34" rx="9" fill="#4e2a95" />
  <rect x="134" y="186" width="22" height="34" rx="9" fill="#4e2a95" />
  <path d="M84 220 l6 8 M95 220 l0 9 M106 220 l-6 8" stroke="#2d1660" stroke-width="3" stroke-linecap="round" />
  <path d="M134 220 l6 8 M145 220 l0 9 M156 220 l-6 8" stroke="#2d1660" stroke-width="3" stroke-linecap="round" />
  <!-- tail -->
  <path d="M176 176 q46 2 48 -44 q-20 24 -40 24 z" fill="#6a3fc0" />
  <!-- larger muscular body -->
  <ellipse cx="120" cy="152" rx="76" ry="66" fill="url(#champBody)" stroke="#4e2a95" stroke-width="3" />
  <!-- chest plate -->
  <path d="M120 100 l34 24 l-14 56 h-40 l-14 -56 z" fill="#2d1660" opacity="0.35" />
  <!-- pair of curved horns -->
  <path d="M96 92 q-16 -30 -30 -34 q22 2 30 20 z" fill="#ffd166" stroke="#c99a2e" stroke-width="2" />
  <path d="M144 92 q16 -30 30 -34 q-22 2 -30 20 z" fill="#ffd166" stroke="#c99a2e" stroke-width="2" />
  <!-- fierce eyes -->
  <path d="M90 140 l24 6 l-22 10 z" fill="#ffe066" />
  <path d="M150 140 l-24 6 l22 10 z" fill="#ffe066" />
  <circle cx="100" cy="148" r="4.5" fill="#2d1660" />
  <circle cx="140" cy="148" r="4.5" fill="#2d1660" />
  <!-- fanged mouth -->
  <path d="M100 176 q20 16 40 0" fill="none" stroke="#1c0f3f" stroke-width="3.5" stroke-linecap="round" />
  <path d="M108 180 l5 10 l5 -10 z M122 180 l5 10 l5 -10 z" fill="#fff" />
</svg>
